apis:
  - name: Absorb Integration API
    description: REST-based interface for integrating external systems with Absorb LMS. Supports user management, course management, enrollment processing, certificate tracking, department administration, and e-learning completion data.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://docs.myabsorb.com/
    baseURL: https://rest.myabsorb.com
